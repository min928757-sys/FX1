<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fx Karam Trading Academy</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root { --primary: #38bdf8; --bg: #0f172a; --card: #1e293b; --text: #f8fafc; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: var(--bg); color: var(--text); text-align: center; padding: 15px; margin: 0; display: flex; flex-direction: column; min-height: 100vh; }
        .container { max-width: 550px; margin: auto; background: var(--card); padding: 20px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.3); flex-grow: 1; overflow-x: hidden; }
        h1 { color: var(--primary); margin-bottom: 5px; font-size: 20px; text-transform: uppercase; letter-spacing: 1px; }
        .status-box { margin: 15px 0; padding: 12px; border-radius: 8px; font-weight: bold; }
        .pending { background-color: #f59e0b; color: #ffffff; }
        .hidden { display: none !important; }
        
        button { background: var(--primary); color: #0f172a; border: none; padding: 12px 20px; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 14px; transition: 0.3s; margin-top: 10px; width: 100%; }
        .nav-container { display: flex; justify-content: center; gap: 4px; flex-wrap: wrap; margin-bottom: 15px; }
        .nav-btn { background: #334155; color: #fff; padding: 8px; flex: 1; min-width: 45px; font-size: 10px; border-radius: 5px; border: none; cursor: pointer; }
        .nav-btn.active { background: var(--primary); color: #0f172a; font-weight: bold; }
        
        .video-container { margin-top: 15px; border: 2px solid var(--primary); border-radius: 10px; overflow: hidden; position: relative; padding-bottom: 56.25%; height: 0; background: #000; }
        .video-container iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
        
        /* Music Control UI */
        .music-bar { background: rgba(56, 189, 248, 0.1); border: 1px solid var(--primary); border-radius: 10px; padding: 10px; margin-top: 25px; display: flex; justify-content: space-between; align-items: center; }
        .music-info { font-size: 10px; font-weight: bold; color: var(--primary); text-transform: uppercase; }
        .music-toggle { background: var(--primary); color: #0f172a; padding: 6px 12px; border-radius: 5px; font-size: 10px; width: auto; margin: 0; }

        .card-title { margin-top: 15px; font-size: 12px; color: var(--primary); font-weight: 800; text-align: left; border-left: 3px solid var(--primary); padding-left: 8px; }
        .card-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 10px; }
        .card-item { background: #0f172a; border-radius: 8px; overflow: hidden; border: 1px solid #334155; cursor: pointer; }
        .card-item img { width: 100%; aspect-ratio: 3/4; object-fit: cover; display: block; }
        .card-label { font-size: 8px; padding: 5px 2px; color: #94a3b8; font-weight: bold; white-space: nowrap; overflow: hidden; }

        .overlay { position: fixed; inset: 0; background: rgba(15, 23, 42, 0.95); z-index: 2000; display: none; flex-direction: column; }
        .overlay.active { display: flex; }
        .ov-header { padding: 15px; display: flex; justify-content: space-between; align-items: center; background: var(--card); border-bottom: 1px solid #334155; }
        .ov-body { flex: 1; padding: 15px; overflow-y: auto; }
        .ov-body img { width: 100%; border-radius: 10px; border: 1px solid var(--primary); margin-bottom: 15px; }

        .quiz-option { background: #334155; color: white; text-align: left; padding: 14px; font-size: 14px; width: 100%; margin-bottom: 8px; border: none; border-radius: 8px; cursor: pointer; transition: 0.2s; }
        .correct { background: #10b981 !important; color: white; font-weight: bold; }
        .wrong { background: #ef4444 !important; color: white; }
        
        .leaderboard-table { width: 100%; border-collapse: collapse; margin-top: 15px; background: #0f172a; border-radius: 10px; overflow: hidden; }
        .leaderboard-table th, .leaderboard-table td { padding: 12px; text-align: center; border-bottom: 1px solid #1e293b; font-size: 12px; }
    </style>
</head>
<body>

    <div class="container">
        <h1>Fx Karam Academy</h1>
        <p style="font-size: 12px;">User ID: <span id="user-id-display" style="font-weight: bold; color: var(--primary);">Connecting...</span></p>

        <div id="locked-section">
            <div class="status-box pending">Approval လိုအပ်ပါသည်</div>
            <p style="font-size: 14px;">KPay: <b>09456507877</b></p>
            <button onclick="window.Telegram.WebApp.openTelegramLink('https://t.me/+cbvtPsUU2gExYmY1')">📸 Screenshot ပို့ရန်</button>
        </div>

        <div id="unlocked-section" class="hidden">
            <div class="nav-container">
                <button class="nav-btn active" id="btn-l1" onclick="showLesson(1)">L-1</button>
                <button class="nav-btn" id="btn-l2" onclick="showLesson(2)">L-2</button>
                <button class="nav-btn" id="btn-l3" onclick="showLesson(3)">L-3</button>
                <button class="nav-btn" id="btn-l4" onclick="showLesson(4)">L-4</button>
                <button class="nav-btn" id="btn-l5" onclick="showLesson(5)">L-5</button>
                <button class="nav-btn" id="btn-l6" onclick="showLesson(6)">L-6</button>
                <button class="nav-btn" id="btn-l7" onclick="showLesson(7)">L-7</button>
                <button class="nav-btn" id="btn-rank" onclick="showLeaderboard()" style="background: #facc15; color: #000;">Rank</button>
            </div>

            <div id="lesson-view">
                <div id="lesson-content-area">
                    <h3 id="lesson-title" style="color:var(--primary); font-size: 16px;">Lesson 1: Market Structure</h3>
                    <div class="video-container"><iframe id="video-frame" src="" frameborder="0" allowfullscreen></iframe></div>
                    <button onclick="startQuiz()">Take Lesson Quiz ✍️</button>
                </div>

                
                <div class="music-bar">
    <div class="music-info">🎵 FX LOFI RADIO: <span id="track-status">OFF</span></div>
    <button class="music-toggle" id="music-btn" onclick="toggleMusic()">PLAY</button>
</div>

<div id="music-player" style="position: absolute; opacity: 0; pointer-events: none; z-index: -1;"></div>


                <div class="card-title">EDUCATIONAL CARDS</div>
                <div class="card-grid" id="main-card-grid"></div>

                <div style="margin-top:20px; font-size: 11px; opacity: 0.6;">
                    Live Account - <a href="https://www.vtmarkets.com/trade-now/?affid=26620293" target="_blank" style="color:var(--primary)">VT Markets</a>
                </div>
            </div>

            <div id="quiz-area" class="hidden">
                <h4 id="quiz-header" style="color: var(--primary);"></h4>
                <div id="question-container">
                    <p id="question-text" style="font-weight: bold; margin-bottom: 20px; text-align: left;"></p>
                    <div id="options-list"></div>
                    <button id="next-btn" class="hidden" onclick="nextQuestion()">Next Question ➔</button>
                </div>
                <div id="quiz-result" class="hidden">
                    <h2 id="current-score-text"></h2>
                    <button onclick="backToLessons()" style="background: #64748b;">Back to Lessons</button>
                </div>
            </div>

            <div id="leaderboard-area" class="hidden">
                <h3 style="color:#facc15;">🏆 Top Traders</h3>
                <table class="leaderboard-table">
                    <thead><tr><th>Rank</th><th>User ID</th><th>Score</th></tr></thead>
                    <tbody id="leaderboard-body"></tbody>
                </table>
                <button onclick="backToLessons()" style="margin-top: 20px;">Back to Lessons</button>
            </div>
        </div>
    </div>

    <!-- Viewer Overlay -->
    <div id="card-viewer" class="overlay">
        <div class="ov-header">
            <span id="ov-title" style="color:var(--primary); font-weight:bold; font-size:14px;"></span>
            <div onclick="closeViewer()" style="color:#ef4444; font-weight:bold; cursor:pointer;">CLOSE</div>
        </div>
        <div class="ov-body" id="ov-content"></div>
    </div>

    <script src="https://www.youtube.com/iframe_api"></script>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, doc, onSnapshot, setDoc, getDocs, collection, query, orderBy, limit } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const tg = window.Telegram.WebApp;
        tg.ready(); tg.expand();

        const firebaseConfig = {
            apiKey: "AIzaSyA5wJhY38C5GMgxjJuGDDejtIje36MvBok",
            authDomain: "trading-app-69b9d.firebaseapp.com",
            projectId: "trading-app-69b9d",
            storageBucket: "trading-app-69b9d.appspot.com",
            messagingSenderId: "573273662231",
            appId: "1:573273662231:web:fbbbc6876711e612190829"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let myUserId = tg.initDataUnsafe?.user?.id?.toString() || "Guest";
        document.getElementById('user-id-display').innerText = myUserId;

        // Music Logic
        let player;
        const playlist = ['XQEC9qGhE6k', 'MPwwmXdCZGw', 'Pxy8Z2K1pF8'];
        let isPlaying = false;

        window.onYouTubeIframeAPIReady = () => {
            player = new YT.Player('music-player', {
                height: '0', width: '0',
                playerVars: { 'autoplay': 0, 'controls': 0, 'disablekb': 1 },
                events: {
                    'onReady': (e) => { e.target.cuePlaylist({ playlist: playlist }); },
                    'onStateChange': (e) => {
                        if (e.data === YT.PlayerState.ENDED) e.target.playVideo();
                    }
                }
            });
        };

        window.toggleMusic = () => {
            if (!isPlaying) {
                player.playVideo();
                document.getElementById('music-btn').innerText = "STOP";
                document.getElementById('track-status').innerText = "ON";
                isPlaying = true;
            } else {
                player.pauseVideo();
                document.getElementById('music-btn').innerText = "PLAY";
                document.getElementById('track-status').innerText = "OFF";
                isPlaying = false;
            }
        };

        const studyCards = [
            { t: 'Entry Setups', i: ['Entry Setups - 1.png','Entry Setups - 2.png','Entry Setups - 3.png','Entry Setups - 4.png','Entry Setups - 5.png','Entry Setups - 6.png'] },
            { t: 'Cypher', i: ['Cypher Pattern - 1.png','Cypher Pattern - 2.png','Cypher Pattern - 3.png','Cypher Pattern - 4.png','Cypher Pattern - 5.png'] },
            { t: 'Market Mech', i: ['Market Mechanics - 1.png','Market Mechanics - 2.png','Market Mechanics - 3.png','Market Mechanics - 4.png','Market Mechanics - 5.png','Market Mechanics - 6.png'] },
            { t: 'Risk MGMT', i: ['Risk Management - 1.png','Risk Management - 2.png','Risk Management - 3.png','Risk Management - 4.png'] } ,
            { t: 'Inducement', i: ['Inducement - 1.png','Inducement - 2.png','Inducement - 3.png','Inducement - 4.png','Inducement - 5.png'] } ,
            { t: 'Equal High', i: ['Equal High - 1.png','Equal High - 2.png','Equal High - 3.png','Equal High - 4.png'] } ,
            { t: 'Gartley Pattern', i: ['Gartley Pattern - 1.png','Gartley Pattern - 2.png','Gartley Pattern - 3.png','Gartley Pattern - 4.png','Gartley Pattern - 5.png'] } ,
            { t: 'Moving Average', i: ['Moving Average - 1.png','Moving Average - 2.png','Moving Average - 3.png','Moving Average - 4.png','Moving Average - 5.png'] } ,
            { t: 'OCL', i: ['OCL - 1.png','OCL - 2.png','OCL - 3.png','OCL - 4.png'] } ,
            { t: 'Quasimodo', i: ['Quasimodo - 1.png','Quasimodo - 2.png','Quasimodo - 3.png','Quasimodo - 4.png'] } ,
            { t: 'SMT', i: ['SMT - 1.png','SMT - 2.png','SMT - 3.png','SMT - 4.png'] } ,
        ];

        let currentLesson = 1, qIdx = 0, qScore = 0;
        const videos = { 1:"jyad4g6F8FU", 2:"DDLsFro2bpc", 3:"DwP9zFAC5EA", 4:"L_zlR6ZxXNg", 5:"GoRcLqAsYUg", 6:"n7owfWxBxmw", 7:"nYuowB5Wyts" };
        const titles = { 1:"Market Structure", 2:"Order Blocks", 3:"Liquidity", 4:"Fair Value Gaps", 5:"Timeframe Correlation", 6:"Risk Management", 7:"Trading Psychology" };

        window.showLesson = (num) => {
            currentLesson = num;
            document.getElementById('lesson-title').innerText = "Lesson " + num + ": " + titles[num];
            document.getElementById('video-frame').src = "https://www.youtube.com/embed/" + videos[num];
            document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('active'));
            document.getElementById('btn-l' + num).classList.add('active');
            document.getElementById('lesson-view').classList.remove('hidden');
            document.getElementById('quiz-area').classList.add('hidden');
            initCards();
        };

        function initCards() {
            const grid = document.getElementById('main-card-grid'); grid.innerHTML = "";
            studyCards.forEach((c, idx) => {
                grid.innerHTML += `<div class="card-item" onclick="viewCard(${idx})"><img src="${c.i[0]}"><div class="card-label">${c.t}</div></div>`;
            });
        }

        window.viewCard = (idx) => {
            const c = studyCards[idx];
            document.getElementById('ov-title').innerText = c.t;
            const content = document.getElementById('ov-content'); content.innerHTML = "";
            c.i.forEach(img => { content.innerHTML += `<img src="${img}">`; });
            document.getElementById('card-viewer').classList.add('active');
        };

        window.closeViewer = () => document.getElementById('card-viewer').classList.remove('active');
        window.backToLessons = () => showLesson(currentLesson);

        if (myUserId !== "Guest") {
            onSnapshot(doc(db, "users", myUserId), (docSnap) => {
                if (docSnap.exists() && docSnap.data().is_approved === true) {
                    document.getElementById('locked-section').classList.add('hidden');
                    document.getElementById('unlocked-section').classList.remove('hidden');
                    showLesson(1);
                }
            });
        }
    </script>
</body>
</html>
